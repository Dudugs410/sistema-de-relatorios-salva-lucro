<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="preconnect" href="https://app.salvalucro.com.br">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://*.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://*.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://app.salvalucro.com.br https://api.pluggy.ai https://cdn.jsdelivr.net https://*.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net;">
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- APP VERSION - Increment on each deployment -->
    <script>
      (function() {
        const APP_VERSION = '2.1.7';
        
        try {
          const storedVersion = localStorage.getItem('app_version');
          
          if (storedVersion !== APP_VERSION) {
            localStorage.setItem('app_version', APP_VERSION);
            window.location.reload(true);
            return;
          }
        } catch(e) {
          console.warn('Version check failed:', e);
        }
      })();
    </script>
    
    <!-- INITIAL THEME - Prevent flash of unstyled content -->
    <script>
      (function() {
        try {
          // Get saved theme and context from localStorage
          const savedTheme = localStorage.getItem('appTheme');
          const savedContext = localStorage.getItem('appContext') || 'salvalucro';
          
          // Apply immediately to prevent flash
          document.documentElement.setAttribute('data-context', savedContext);
          
          if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
          
          // Mark as applied
          document.documentElement.setAttribute('data-theme-applied', 'true');
          
          // Store in sessionStorage for backup
          sessionStorage.setItem('themeMode', savedTheme || 'light');
          sessionStorage.setItem('themeContext', savedContext);
          
          // Add style to prevent flash
          const style = document.createElement('style');
          style.textContent = `
            /* Prevent flash of unstyled content */
            html:not([data-theme-applied]) #root {
              opacity: 0;
            }
            html[data-theme-applied] #root {
              opacity: 1;
              transition: opacity 0.1s ease-in;
            }
            
            /* Theme variables - will be overridden by React but provides fallback */
            :root {
              --bg-color: #ffffff;
              --text-color: #333333;
              --border-color: #e0e0e0;
              --header-bg: #ffffff;
              --sidebar-bg: #ffffff;
            }
            
            [data-theme="dark"] {
              --bg-color: #1a1a1a;
              --text-color: #ffffff;
              --border-color: #333333;
              --header-bg: #1a1a1a;
              --sidebar-bg: #1a1a1a;
            }
          `;
          document.head.appendChild(style);
          
        } catch(e) {
          // Fallback on error
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.setAttribute('data-context', 'salvalucro');
          console.error('Theme initialization error:', e);
        }
      })();
    </script>
    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="SalvaLucro" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>SALVALUCRO | Financeiro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
