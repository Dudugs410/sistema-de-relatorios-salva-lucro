<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="preconnect" href="https://app.salvalucro.com.br">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https:;
      connect-src 'self' https://app.salvalucro.com.br https://api.pluggy.ai;
    ">
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Theme initialization script - runs before React loads to prevent FOUC -->
    <script>
      (function() {
        try {
          const savedContext = localStorage.getItem('appContext');
          const savedTheme = localStorage.getItem('appTheme');
          if (savedContext) {
            document.documentElement.setAttribute('data-context', savedContext);
            console.log('Pre-render: Applied context', savedContext);
          } else {
            // Set default context if none saved
            document.documentElement.setAttribute('data-context', 'salvalucro');
          }
          if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            console.log('Pre-render: Applied theme', savedTheme);
          } else {
            // Set default theme if none saved
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {
          console.log('Theme initialization error:', e);
        }
      })();
    </script>
    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-title" content="Your App Title">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>SALVALUCRO | Financeiro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
