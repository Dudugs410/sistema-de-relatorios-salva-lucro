<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="preconnect" href="https://app.salvalucro.com.br">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- CACHE CONTROL - Force fresh content -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- UPDATED CSP - Added CDN to connect-src for source maps -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://*.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://*.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://app.salvalucro.com.br https://api.pluggy.ai https://cdn.jsdelivr.net https://*.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net;">
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- APP VERSION - Increment this on each deployment -->
    <script>
      (function() {
        const APP_VERSION = '2.1.3';
        
        try {
          const storedVersion = localStorage.getItem('app_version');
          
          if (storedVersion !== APP_VERSION) {
            localStorage.setItem('app_version', APP_VERSION);
            window.location.reload(true);
            return;
          }
        } catch(e) {
          console.warn('Version check failed:', e);
        }
      })();
    </script>
    
    <!-- CRITICAL: Enhanced Theme initialization script - runs before any CSS loads -->
    <script>
      (function() {
        try {
          // Helper function to get context from user data
          function getContextFromUser(userData) {
            if (!userData) return null;
            try {
              const user = typeof userData === 'string' ? JSON.parse(userData) : userData;
              if (user.GRUCODIGO === 'SIFRA') return 'SIFRA';
              if (user.GRUCODIGO === 'MG') return 'MG';
              if (user.GRUCODIGO === 'superjur') return 'superjur';
              if (user.GRUCODIGO === 'carddigital') return 'carddigital';
              if (user.CONTEXT) return user.CONTEXT;
              return null;
            } catch(e) {
              return null;
            }
          }

          const savedContext = localStorage.getItem('appContext');
          const savedTheme = localStorage.getItem('appTheme');
          const userData = localStorage.getItem('user');
          const token = localStorage.getItem('token');
          
          let finalContext = 'salvalucro';
          
          if (savedContext) {
            finalContext = savedContext;
          } else if (token && userData) {
            const contextFromUser = getContextFromUser(userData);
            if (contextFromUser) finalContext = contextFromUser;
          }
          
          let finalTheme = 'light';
          
          if (savedTheme) {
            finalTheme = savedTheme;
          } else if (token && userData) {
            try {
              const user = typeof userData === 'string' ? JSON.parse(userData) : userData;
              if (user.TEMA === true) finalTheme = 'dark';
            } catch(e) {}
          }
          
          document.documentElement.setAttribute('data-context', finalContext);
          document.documentElement.setAttribute('data-theme', finalTheme);
          
          sessionStorage.setItem('themeInitialized', 'true');
          sessionStorage.setItem('themeContext', finalContext);
          sessionStorage.setItem('themeMode', finalTheme);
          
          const style = document.createElement('style');
          style.textContent = `
            /* Hide content briefly until theme is fully applied */
            html:not([data-context]) #root,
            html:not([data-theme]) #root {
              opacity: 0;
            }
            html[data-context][data-theme] #root {
              opacity: 1;
              transition: opacity 0.15s ease-in;
            }
          `;
          document.head.appendChild(style);
          
        } catch(e) {
          console.error('Theme initialization error:', e);
          document.documentElement.setAttribute('data-context', 'salvalucro');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-title" content="SalvaLucro">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>SALVALUCRO | Financeiro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
